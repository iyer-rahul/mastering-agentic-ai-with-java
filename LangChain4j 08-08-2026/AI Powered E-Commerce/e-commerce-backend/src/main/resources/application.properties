spring.application.name=E-Commerce-Backend

# Cloud Run picks the port and passes it in as PORT. Locally there is no PORT, so 8080 stands.
server.port=${PORT:8080}

# Where the database is when Docker Compose is not the one providing it - a deployed environment,
# for instance, which has no compose file. Locally these are ignored: spring-boot-docker-compose
# contributes a JdbcConnectionDetails bean, and connection detail beans outrank these properties.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/e-com-telusko}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:telusko}
# ---------- File uploads (product images) ----------
# The default is 1MB, which AI-generated product photos exceed - gpt-image-1 returns roughly
# 1.3MB for a 1024x1024 PNG, so "generate image then create product" failed on the upload.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true


# Mail delivery is best-effort (see MailService), so SMTP availability must not drive
# /actuator/health, which the Docker HEALTHCHECK depends on.
management.health.mail.enabled=false

# ---------- Monitoring (Actuator + Prometheus + Grafana) ----------
# Prometheus scrapes /actuator/prometheus. See monitoring/ for the stack.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Every metric is tagged with the app name so one Grafana instance can watch several apps.
management.metrics.tags.application=e-commerce-backend
# Percentiles for the HTTP and AI timers, so the dashboard can show p95/p99 rather than
# only averages - an average hides the slow LLM calls that users actually notice.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.gen_ai.client.operation=true
management.metrics.distribution.percentiles-histogram.ecommerce.ai.feature=true
# Vector search is published as a plain summary by default, which has no buckets - so a p95
# panel over it renders empty. Opting into a histogram is what makes the percentile computable.
management.metrics.distribution.percentiles-histogram.db.vector.client.operation=true

# Spring AI publishes its own observations (model latency, token usage per call).
spring.ai.chat.client.observations.include-input=false
spring.ai.chat.observations.include-completion=false
spring.ai.chat.observations.include-prompt=false
# Prompts and completions stay OUT of metrics and traces on purpose: they contain customer
# names, addresses and order details, and observability backends are not access controlled.

# Trace every request in local development. Lower this in production - tracing all LLM traffic
# is expensive and rarely necessary once the system is stable.
management.tracing.sampling.probability=1.0

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=your_mailtrap_username
spring.mail.password=your_mailtrap_password

# HS256 needs a key of at least 32 bytes. Override with a real JWT_SECRET outside local dev.
security.jwt.secret=${JWT_SECRET:dev-only-local-jwt-secret-change-me-32bytes-min}
security.jwt.issuer=telusko-auth
security.jwt.accessMinutes=30
security.jwt.refreshDays=7

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:5173}

# Cloudinary configs
cloudinary.cloud-name=your-cloud-name
cloudinary.api-key=your-cloudinary-api-key
cloudinary.api-secret=your-cloudinary-api-secret
cloudinary.folder=ecommerce

# ---- GitHub OAuth2 ----
# NOTE: these were hardcoded here. Rotate the GitHub OAuth app secret and set GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID: your-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET: your-github-client-secret}
spring.security.oauth2.client.registration.github.scope=user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.client-name=GitHub


#app.oauth2.redirect-url=${FRONTEND_URL:http://localhost:5173}/oauth2/success
app.oauth2.redirect-url=http://localhost:8080/oauth2/test-success

# Razorpay configs
razorpay.api.key=your_razorpay_api_key
razorpay.api.secret=your_razorpay_api_secret

# OpenAI configs
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
# Image model. gpt-image-1 is the current one; dall-e-3 is not available on all accounts.
spring.ai.openai.image.options.model=gpt-image-1


#Vector DB Configurations
spring.sql.init.schema-locations=classpath:init/schema.sql
spring.sql.init.mode=always
spring.ai.openai.embedding.options.model=text-embedding-3-small

# ---- PGVector ----
# Configured here rather than in a @Bean. There used to be a VectorStoreConfig class, but Spring
# AI's auto-configuration replaced its bean (allowed by allow-bean-definition-overriding below),
# so none of its settings ever applied.
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=vector_store
# init/schema.sql declares id as TEXT. The default is UUID, which rejects the readable, stable
# document ids ("PRODUCT-12") that let re-indexing overwrite an entity instead of duplicating it.
spring.ai.vectorstore.pgvector.id-type=TEXT
spring.main.allow-bean-definition-overriding=true

# ---------- Frontend ----------
# Where the storefront runs. Emailed verification and password-reset links point here, so the
# customer lands on a real page instead of a raw API response.
app.frontend.base-url=${FRONTEND_URL_BASE:http://localhost:5173}
