# Tells Grafana to use Prometheus as its data source automatically on startup.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    # Fixed uid so the provisioned dashboard can reference this datasource by name.
    # Without it Grafana generates a random uid and the dashboard panels come up empty.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
