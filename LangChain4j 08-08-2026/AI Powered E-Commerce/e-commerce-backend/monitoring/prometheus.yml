# How often to collect metrics and from where.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'e-commerce-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # The app runs on the host (mvn spring-boot:run). From inside Docker, the
      # host machine is reached via host.docker.internal (Windows and Mac).
      - targets: ['host.docker.internal:8080']
