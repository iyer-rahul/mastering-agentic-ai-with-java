spring.application.name=ai-gemini-app
#spring.ai.openai.api-key=
spring.ai.anthropic.api-key=your-anthropic-api-key
spring.ai.anthropic.chat.options.model=claude-sonnet-4-5
#spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
#spring.ai.openai.chat.completions-path=/chat/completions
#spring.ai.openai.chat.options.model=gemini-2.5-flash
#spring.ai.openai.chat.options.temperature=0.7

spring.ai.mistralai.api-key=your-mistral-api-key
spring.ai.mistralai.embedding.options.model=mistral-embed

spring.ai.model.chat=anthropic
spring.ai.model.embedding=mistral


#spring.ai.openai.embedding.embeddings-path=/embeddings
#spring.ai.openai.embedding.options.model=gemini-embedding-001
#spring.ai.openai.embedding.options.dimensions=1536



spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=claude_docs
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
