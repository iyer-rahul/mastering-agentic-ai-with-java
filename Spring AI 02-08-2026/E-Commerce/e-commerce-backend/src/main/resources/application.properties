spring.application.name=E-Commerce-Backend-Base

# Cloud Run picks the port and passes it in as PORT. Locally there is no PORT, so 8080 stands.
server.port=${PORT:8080}

# Points at a Postgres running on this machine. Create the database once before the first start:
#   CREATE DATABASE telusko;
# Tables are then created by Hibernate (ddl-auto=update below).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/your_database_name_here}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_postgres_password_here}

# ---------- File uploads (product images) ----------
# The default is 1MB, which is small for a product photograph straight off a phone or camera.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Mail delivery is best-effort (see MailService), so SMTP availability must not drive
# /actuator/health, which the Docker HEALTHCHECK depends on.
management.health.mail.enabled=false

# ---------- Mail (Mailtrap sandbox) ----------
# Verification and password-reset codes are sent here. Put your own inbox credentials in.
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=your_mailtrap_username_here
spring.mail.password=your_mailtrap_password_here


# HS256 needs a key of at least 32 bytes. Override with a real JWT_SECRET outside local dev.
security.jwt.secret=${JWT_SECRET:dev-only-local-jwt-secret-change-me-32bytes-min}
security.jwt.issuer=telusko-auth
security.jwt.accessMinutes=30
security.jwt.refreshDays=7

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:5173}

# ---------- Cloudinary (product image hosting) ----------
# Cloudinary configs
cloudinary.cloud-name=your_cloud_name_here
cloudinary.api-key=your_api_key_here
cloudinary.api-secret=your_api_secret_here
cloudinary.folder=your_folder_name_here

# ---------- GitHub OAuth2 login ----------
# The fallbacks are placeholders, not real credentials, and they are deliberately not blank:
# Spring Boot validates every declared registration and refuses to start with
# "Client id of registration 'github' must not be empty". Swap in a real GitHub OAuth app's
# values (or set GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET) to make the Sign in with GitHub button
# actually work. Email and password login does not depend on this.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.github.scope=user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.client-name=GitHub

app.oauth2.redirect-url=http://localhost:8080/oauth2/test-success

# ---------- Razorpay (online payments) ----------
razorpay.api.key=your_api_key_here
razorpay.api.secret=your_api_secret_here

# Beans are not redefined anywhere, so overriding stays off - a duplicate bean should fail the
# startup rather than silently replace something.
spring.main.allow-bean-definition-overriding=false

# ---------- Frontend ----------
# Where the storefront runs. Verification and reset emails link here, so the customer lands on a
# real page instead of a raw API response.
app.frontend.base-url=${FRONTEND_URL_BASE:http://localhost:5173}
